<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "" | relLangURL }}">
      <span class="bean" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 14C4 8 9 3 15 3c2.8 0 4.5 1.7 4.5 3.8 0 4.7-4.6 8.4-9.8 9.9C6.4 17.7 4 16.3 4 14Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          <path d="M6.5 15.5C9 12 12.5 9.5 17 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>vulgaris<span class="prompt">/</span>
    </a>
    <nav aria-label="Primary">
      <ul class="main-nav">
        {{ $currentPage := . }}
        {{ range site.Menus.main }}
          <li>
            <a href="{{ .URL }}"
               {{ if or ($currentPage.IsMenuCurrent "main" .) ($currentPage.HasMenuCurrent "main" .) }}aria-current="page"{{ end }}>
              {{ .Name }}
            </a>
          </li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>

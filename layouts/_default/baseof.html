<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ if .IsHome }}{{ partial "starfield.html" . }}{{ end }}
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script src="{{ "js/main.js" | relURL }}" defer></script>

  {{ if .Params.math }}
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeGSCF5bnXQiFPxYbBIn" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <script defer>
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false }
        ]
      });
    });
  </script>
  {{ end }}

  {{ if .Params.mermaid }}
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    const blocks = document.querySelectorAll("pre > code.language-mermaid");
    blocks.forEach(function (code) {
      const container = document.createElement("div");
      container.className = "mermaid";
      container.textContent = code.textContent;
      code.parentElement.replaceWith(container);
    });
    mermaid.initialize({
      startOnLoad: true,
      theme: "dark",
      themeVariables: {
        background: "#1a1615",
        primaryColor: "#211d1c",
        primaryTextColor: "#e6e8e1",
        primaryBorderColor: "#92c22c",
        lineColor: "#8d9a8f",
        secondaryColor: "#12120f",
        tertiaryColor: "#12120f",
        fontFamily: "Roboto Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
      }
    });
  </script>
  {{ end }}
</body>
</html>

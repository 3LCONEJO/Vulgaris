baseURL = "https://3lconejo.github.io/Vulgaris/"
title = "Vulgaris"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
summaryLength = 40

# --- GitHub Pages note ---
# If this repo will be served at https://USERNAME.github.io/  (a "user/org site")
# set baseURL = "https://USERNAME.github.io/" and remove the /vulgaris/ subpath below.
# If it will be served at https://USERNAME.github.io/vulgaris/ (a "project site")
# keep the subpath as-is. See README.md for the full explanation.

# --- El vault de Obsidian se monta como contenido ---
# Escribes en GRN/ con Obsidian; Hugo lo publica. No se copia nada.
# La estructura del vault espeja la clave de letra del proyecto (A=pyCisTopic,
# B=general, C=cicero, D=integrate, E=cisTarget, F=SCENIC+, G=scglue), igual que
# 1_scripts/ en el repo real. Dentro de cada rama, `nextflow` (como se orquesta)
# y `codigo` (que hace cada script) son hermanos, no uno dentro del otro.
# Al declarar mounts para "content" hay que declarar TODOS, incluido el default.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"

  # -- transversal: la migracion a Nextflow en si --
  [[module.mounts]]
    source = "GRN/nextflow"
    target = "content/projects/jaguar/nextflow"
    lang = "es"

  # -- ramas --
  [[module.mounts]]
    source = "GRN/A_pyCisTopic/nextflow"
    target = "content/projects/jaguar/a-pycistopic/nextflow"
    lang = "es"
  [[module.mounts]]
    source = "GRN/A_pyCisTopic/codigo"
    target = "content/projects/jaguar/a-pycistopic/codigo"
    lang = "es"
  [[module.mounts]]
    source = "GRN/B_general/nextflow"
    target = "content/projects/jaguar/b-general/nextflow"
    lang = "es"
  [[module.mounts]]
    source = "GRN/B_general/codigo"
    target = "content/projects/jaguar/b-general/codigo"
    lang = "es"
  [[module.mounts]]
    source = "GRN/C_cicero/codigo"
    target = "content/projects/jaguar/c-cicero/codigo"
    lang = "es"
  [[module.mounts]]
    source = "GRN/D_integrate/codigo"
    target = "content/projects/jaguar/d-integrate/codigo"
    lang = "es"
  [[module.mounts]]
    source = "GRN/G_scglue/codigo"
    target = "content/projects/jaguar/g-scglue/codigo"
    lang = "es"

  # -- transversal: glosario --
  [[module.mounts]]
    source = "GRN/sintaxis/nextflow"
    target = "content/projects/jaguar/sintaxis/nextflow"
    lang = "es"
  [[module.mounts]]
    source = "GRN/sintaxis/bash"
    target = "content/projects/jaguar/sintaxis/bash"
    lang = "es"

[pagination]
  pagerSize = 9

[taxonomies]
  tag = "tags"
  category = "categories"

[permalinks]
  [permalinks.page]
    # projects: sin override a proposito. La URL sale del path del archivo, que
    # es lo unico que soporta secciones anidadas (la guia vive en
    # /projects/jaguar/nextflow/...). El slug del frontmatter sigue mandando,
    # por eso content/projects/tepolito.md publica en /projects/teporingo/.
    blog = "/blog/:slug/"

[markup]
  [markup.highlight]
    style = "dracula"   # unused for color now that noClasses=false below — see static/css/syntax.css
    noClasses = false
    lineNos = false
    codeFences = true
    guessSyntax = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"]]

[menu]
  [[menu.main]]
    name = "~/cv"
    pageRef = "/cv"
    weight = 5
  [[menu.main]]
    name = "~/projects"
    pageRef = "/projects"
    weight = 10
  [[menu.main]]
    name = "~/blog"
    pageRef = "/blog"
    weight = 20
  [[menu.main]]
    name = "~/tags"
    pageRef = "/tags"
    weight = 30

[params]
  author = "Jorge Alfredo Suazo Victoria"
  tagline = "Complex Systems & Single-Cell // building from seed to pipeline"
  description = "Vulgaris — a documentation-first portfolio bridging code and biology, named for Phaseolus vulgaris, the common bean."
  email = "jasvpj@gmail.com"
  github = "https://github.com/3LCONEJO"
  linkedin = "https://linkedin.com/in/Notyet"
  siteVersion = "alpha 0.1"
  accessibilityNote = ""

  # Home hero — the ~$ whoami terminal block
  [params.whoami]
    lines = [
      "guest@vulgaris:~$ whoami",
      "student — complex systems, single-cell genomics.",
      "guest@vulgaris:~$ cv | grep important", 
      "see my cv here -> https://3lconejo.github.io/Vulgaris/cv/",
      "guest@vulgaris:~$ cat mission.txt",
      "turning lab notebooks and repos into documentation people can learn from"
    ]

  # Featured project slugs shown on the home page, in order
  featuredProjects = ["tepolito", "jaguar", "scatac-chromatin-pipeline"]

# --- Idiomas -----------------------------------------------------------------
[languages]
  [languages.en]
    languageName = "english"
    languageCode = "en-us"
    weight = 1
  [languages.es]
    languageName = "español"
    languageCode = "es"
    weight = 2
    title = "Vulgaris"
    [languages.es.params]
      tagline = "Sistemas complejos y célula única // de la semilla al pipeline"
      description = "Vulgaris — un portafolio hecho de documentación, entre el código y la biología. El nombre viene de Phaseolus vulgaris, el frijol común."

    # Menu propio del espanol. cv y blog todavia no tienen version en espanol,
    # asi que apuntan a las paginas en ingles a proposito (existen y funcionan).
    [languages.es.menus]
      [[languages.es.menus.main]]
        name = "~/guia"
        url = "/es/projects/jaguar/"
        weight = 5
      [[languages.es.menus.main]]
        name = "~/proyectos"
        url = "/es/projects/"
        weight = 10
      [[languages.es.menus.main]]
        name = "~/cv"
        url = "/cv/"
        weight = 20
      [[languages.es.menus.main]]
